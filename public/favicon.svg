<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2552"/>
      <stop offset="1" stop-color="#1b1228"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb26b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb26b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- sun peeking out behind a cloud -->
  <circle cx="49" cy="12" r="6.5" fill="#febc2e"/>
  <path d="M40 19.5a4.2 4.2 0 0 1 3.6-4.2 5.4 5.4 0 0 1 10.3 1.2 3.5 3.5 0 0 1 .4 7H43.6A3.8 3.8 0 0 1 40 19.5z" fill="#f3e8ef"/>

  <!-- plinth -->
  <path d="M12 40 32 51v5L12 45z" fill="#b8aec6"/>
  <path d="M32 51 52 40v5L32 56z" fill="#8f84a0"/>

  <!-- floor -->
  <path d="M12 40 32 29 52 40 32 51z" fill="#d9a179"/>
  <path d="M22 45.5 42 34.5M17 42.7 37 31.7M27 48.3 47 37.3" stroke="#c48a60" stroke-width="0.8"/>

  <!-- back walls -->
  <path d="M12 40 32 29V12L12 23z" fill="#eceae4"/>
  <path d="M32 29 52 40V23L32 12z" fill="#d9cfdc"/>

  <!-- warm window on the right wall -->
  <ellipse cx="42" cy="26" rx="10" ry="8" fill="url(#glow)"/>
  <path d="M38 26.3 46 30.7v-7L38 19.3z" fill="#ffb26b"/>
  <path d="M42 28.5v-7M38 22.8l8 4.4" stroke="#c98a57" stroke-width="1"/>

  <!-- monitor glow on the left wall -->
  <path d="M18 30.2 26 25.8v-5L18 25.2z" fill="#9fd0ff"/>

  <!-- bed on the floor -->
  <path d="M35 42.5 43 38.1 48 40.8 40 45.2z" fill="#5c8fd8"/>
  <path d="M40 45.2 48 40.8v1.6L40 46.8zM35 42.5l5 2.7v1.6l-5-2.7z" fill="#2e4a7d"/>

  <!-- timber posts and roof beams -->
  <path d="M12 41V23M52 41V23" stroke="#a5683b" stroke-width="3" stroke-linecap="round"/>
  <path d="M10 23.6 32 11.5l22 12.1" fill="none" stroke="#c98a57" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
